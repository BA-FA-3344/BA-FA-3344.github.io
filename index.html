    .resources { list-style: none; padding: 0; margin: 2.5rem 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; }
    .resources li { min-width: 9rem; padding: .875rem 1.25rem; border: 1px solid #dbe3e9; border-radius: .625rem; background: #fff; }
